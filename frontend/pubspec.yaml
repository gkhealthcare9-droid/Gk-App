name: sales_grow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.2
  font_awesome_flutter: ^11.0.0
  signature: ^6.3.0
  url_launcher: ^6.3.1
  syncfusion_flutter_pdfviewer: ^33.2.3
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.20.2
  share_plus: ^12.0.2
  dio: ^5.8.0+1
  jwt_decoder: ^2.0.1
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  permission_handler: ^12.0.1
  pinput: ^6.0.2
  number_to_words: ^1.0.0
  http: ^1.3.0
  flutter_secure_storage: ^10.0.0
  open_file: ^3.5.10
  flutter_slidable: ^4.0.0
  quickalert: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
